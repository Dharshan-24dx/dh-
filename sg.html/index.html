<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Harsha 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial;
text-align:center;
background:linear-gradient(135deg,#fff1f5,#ffd6e7);
}

/* LOGIN PAGE */

#loginPage{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;

background:
linear-gradient(rgba(255,240,246,0.6), rgba(255,240,246,0.6)),
url("hearts.png");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:200;
}

.loginTitle{
font-family:'Dancing Script', cursive;
font-size:42px;
color:#c2185b;
margin-bottom:40px;
}

.btnContainer{
position:relative;
width:100%;
height:250px;
}

#yesBtn, #noBtn{
position:absolute;
padding:12px 25px;
font-size:18px;
border:none;
border-radius:20px;
cursor:pointer;
}

#yesBtn{
background:#ff4d6d;
color:white;
left:30%;
}

#noBtn{
background:#ccc;
left:60%;
}

/* CAUGHT TEXT */

#caughtText{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0);
font-size:40px;
font-family:'Great Vibes', cursive;
color:#ff4d6d;
opacity:0;
pointer-events:none;
}

.showCaught{
animation:pop 0.8s forwards;
}

@keyframes pop{
0%{transform:translate(-50%,-50%) scale(0);opacity:0;}
50%{opacity:1;}
100%{transform:translate(-50%,-50%) scale(1.3);opacity:0;}
}

/* GAME */

h1{
color:#c2185b;
font-size:40px;
margin-top:20px;
}

#score{
color:#c2185b;
font-size:22px;
}

#gameArea{
position:relative;
width:100%;
height:80vh;
border-top:2px solid #f8bbd0;
overflow:hidden;
}

.heart{
position:absolute;
font-size:30px;
}

#basket{
position:absolute;
bottom:20px;
left:50%;
width:140px;
height:30px;
background:white;
border-radius:20px;
border:3px solid black;
transform:translateX(-50%);
z-index:10;
}

@keyframes bounce{
0%{transform:translateX(-50%) translateY(0);}
50%{transform:translateX(-50%) translateY(-10px);}
100%{transform:translateX(-50%) translateY(0);}
}

.bounce{
animation:bounce 0.25s ease;
}

/* PETALS */

.petal{
position:fixed;
top:-20px;
font-size:20px;
opacity:1;
pointer-events:none;
animation:fallWind linear forwards;
text-shadow:
0 0 5px rgba(255,255,255,0.9),
0 0 10px rgba(255,192,203,0.8),
0 0 15px rgba(255,192,203,0.6);
}

@keyframes fallWind{
0%{transform:translate(0,0) rotate(0deg);opacity:0;}
10%{opacity:1;}
50%{transform:translate(40px,50vh) rotate(180deg);}
100%{transform:translate(-40px,110vh) rotate(360deg);opacity:0;}
}

/* TRANSITION */

#transitionScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#fff0f6;
display:none;
z-index:100;
overflow:hidden;
}

.burstHeart{
position:absolute;
font-size:40px;
animation:heartBurst 2s forwards;
}

@keyframes heartBurst{
0%{transform:scale(0);opacity:0;}
50%{opacity:1;}
100%{transform:scale(3);opacity:0;}
}

/* FINAL PAGE */

#messagePage{
display:none;
height:100vh;

background:
linear-gradient(rgba(255,240,246,0.5), rgba(255,240,246,0.5)),
url("bh.png");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

color:#c2185b;
justify-content:center;
align-items:center;
flex-direction:column;
opacity:0;
transition:opacity 2s;
position:relative;
overflow:hidden;
}

/* BACKGROUND NAMES (RESTORED) */

#bgNames{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%) rotate(-15deg);
font-family:'Great Vibes', cursive;
font-size:90px;
color:#ffb6c1;
opacity:0.15;
white-space:nowrap;
pointer-events:none;
text-shadow:
0 0 20px rgba(255,182,193,0.6),
0 0 40px rgba(255,192,203,0.4);
transition:all 1s ease;
}

.glowFinal{
opacity:0.6 !important;
color:#ff4d6d !important;
text-shadow:
0 0 15px #ff4d6d,
0 0 30px #ff85a2,
0 0 60px #ffc2d1;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{transform:translate(-50%,-50%) rotate(-15deg) scale(1);}
50%{transform:translate(-50%,-50%) rotate(-15deg) scale(1.05);}
100%{transform:translate(-50%,-50%) rotate(-15deg) scale(1);}
}

/* FLOAT HEARTS */

.bgHeart{
position:absolute;
font-size:25px;
opacity:0.6;
animation:floatUp 6s linear infinite;
text-shadow:
0 0 8px #ff4d6d,
0 0 15px #ff85a2,
0 0 25px #ffc2d1;
}

@keyframes floatUp{
0%{transform:translateY(100vh) scale(0.5);opacity:0;}
20%{opacity:1;}
100%{transform:translateY(-10vh) scale(1.2);opacity:0;}
}

#loveText{
font-family:'Dancing Script', cursive;
font-size:26px;
width:60%;
white-space:pre-line;
z-index:2;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
<h1 class="loginTitle">Wanna catch Dharshan's hearts?</h1>

<div class="btnContainer">
<button id="yesBtn">Yes</button>
<button id="noBtn">No</button>
</div>

<div id="caughtText">Caught you</div>
</div>

<audio id="bgMusic" loop>
<source src="keys-of-moon-white-petals(chosic.com).mp3" type="audio/mpeg">
</audio>

<div id="gamePage">
<h1>Catch Dharshan's Heart ❤️</h1>
<p id="score">Score: 0</p>
<div id="gameArea">
<div id="basket"></div>
</div>
</div>

<div id="transitionScreen"></div>

<div id="messagePage">

<!-- ✅ RESTORED -->
<div id="bgNames">Dharshan 💖 Harsha</div>

<h1>❤️ A Message For You ❤️</h1>
<p id="loveText"></p>

</div>

<script>

/* LOGIN + MUSIC */

let noBtn=document.getElementById("noBtn");
let yesBtn=document.getElementById("yesBtn");
let music=document.getElementById("bgMusic");

let gameStarted=false;

document.getElementById("gamePage").style.display="none";

yesBtn.onclick=()=>{
document.getElementById("caughtText").classList.add("showCaught");

music.currentTime=0;
music.play().catch(()=>{});

setTimeout(()=>{
document.getElementById("loginPage").style.display="none";
document.getElementById("gamePage").style.display="block";

startGame();

},800);
};

/* NO BUTTON */

document.addEventListener("mousemove",(e)=>{

let rect=noBtn.getBoundingClientRect();

let btnX=rect.left+rect.width/2;
let btnY=rect.top+rect.height/2;

let dx=e.clientX-btnX;
let dy=e.clientY-btnY;
let distance=Math.hypot(dx,dy);

if(distance<120){

// angle-based movement (safe)
let angle=Math.atan2(dy,dx) + (Math.random()*0.6 - 0.3);
let moveDistance=60;

let newX=rect.left - Math.cos(angle)*moveDistance + (Math.random()*10 - 5);
let newY=rect.top - Math.sin(angle)*moveDistance + (Math.random()*15 - 5);

// keep inside screen
let maxX=window.innerWidth-rect.width-10;
let maxY=window.innerHeight-rect.height-10;

newX=Math.max(10,Math.min(newX,maxX));
newY=Math.max(10,Math.min(newY,maxY));

noBtn.style.left=newX+"px";
noBtn.style.top=newY+"px";
}

});

/* PETALS */

function createPetal(){
let petal=document.createElement("div");
petal.className="petal";

let shapes=["❀","✿","❁","❃","❋"];
petal.innerHTML=shapes[Math.floor(Math.random()*shapes.length)];

petal.style.left=Math.random()*100+"vw";

let colors=["#ffffff","#ffe4ec","#ffd6e7","#fff0f5"];
petal.style.color=colors[Math.floor(Math.random()*colors.length)];

petal.style.animationDuration=(6+Math.random()*6)+"s";

document.body.appendChild(petal);
setTimeout(()=>petal.remove(),12000);
}
setInterval(createPetal,300);

/* GAME + TRANSITION (unchanged except glow trigger) */

let basket=document.getElementById("basket");
let gameArea=document.getElementById("gameArea");

let score=0;
let gameOver=false;
let heartInterval;

let basketX=window.innerWidth/2;
basket.style.left=basketX+"px";

document.addEventListener("keydown",function(e){
if(!gameStarted) return;

if(e.key==="ArrowLeft") basketX-=40;
if(e.key==="ArrowRight") basketX+=40;
if(basketX<70) basketX=70;
if(basketX>window.innerWidth-70) basketX=window.innerWidth-70;
basket.style.left=basketX+"px";
});

function startGame(){
gameStarted=true;
heartInterval=setInterval(createHeart,1000);
}

function createHeart(){
if(gameOver) return;

let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";

heart.style.left=Math.random()*window.innerWidth+"px";
heart.style.top="0px";

gameArea.appendChild(heart);

let fall=setInterval(function(){
heart.style.top=(heart.offsetTop+5)+"px";

if(heart.offsetTop>window.innerHeight){
heart.remove();
clearInterval(fall);
}

let b=basket.getBoundingClientRect();
let h=heart.getBoundingClientRect();

if(h.bottom>=b.top && h.left<=b.right && h.right>=b.left){

score++;
document.getElementById("score").innerHTML="Score: "+score;

basket.classList.add("bounce");
setTimeout(()=>basket.classList.remove("bounce"),200);

heart.remove();
clearInterval(fall);

if(score>=29 && !gameOver){
gameOver=true;
startTransition();
}
}

},30);
}

function createBgHeart(){
let heart=document.createElement("div");
heart.className="bgHeart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(15+Math.random()*20)+"px";
document.getElementById("messagePage").appendChild(heart);
setTimeout(()=>heart.remove(),6000);
}

function startTransition(){

clearInterval(heartInterval);

let transition=document.getElementById("transitionScreen");
transition.style.display="block";

for(let i=0;i<120;i++){
let heart=document.createElement("div");
heart.className="burstHeart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.top=Math.random()*100+"vh";
transition.appendChild(heart);
}

setTimeout(function(){

document.getElementById("gamePage").style.display="none";
transition.style.display="none";

let msg=document.getElementById("messagePage");
msg.style.display="flex";

setInterval(createBgHeart,300);

setTimeout(()=>{
msg.style.opacity="1";

let message = `You caught every heart falling from the sky…
just like you caught mine in real life.

One message. One year.
And now… you mean everything to me ❤️`;


typeWriter(message, document.getElementById("loveText"), 40, ()=>{

// ✅ GLOW TRIGGER RESTORED
setTimeout(()=>{
document.getElementById("bgNames").classList.add("glowFinal");
},1000);

});

},500);

},2000);
}

function typeWriter(text, element, speed=40, callback){
let i=0;
function typing(){
if(i<text.length){
element.innerHTML+=text.charAt(i);
i++;
setTimeout(typing,speed);
}else if(callback){
callback();
}
}
typing();
}

</script>

</body>
</html>
